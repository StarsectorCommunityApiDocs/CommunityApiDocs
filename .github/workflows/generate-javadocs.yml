name: Generate Javadocs

on:
  push:
    branches:
      - main
      - ci
  workflow_dispatch:

permissions:
  contents: write  # Needed to update the gh-pages branch

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v3
        with:
          submodules: false

      - name: Checkout submodule with custom token
        run: |
          # Update the submodule URL to use the custom token
          git config --file=.gitmodules submodule.StarsectorJarsPrivate.url https://x-access-token:${{ secrets.PRIVATE_REPO_PAT }}@github.com/StarsectorCommunityApiDocs/StarsectorJarsPrivate.git

          # Initialize and update the submodule
          git submodule sync
          git submodule update --init --recursive

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "26"

      - name: Download annotations jar
        run: |
          # Global.java uses @NotNull and @Nullable.
          mkdir -p extra-jars
          curl -sSfL -o extra-jars/annotations-24.1.0.jar \
            https://repo1.maven.org/maven2/org/jetbrains/annotations/24.1.0/annotations-24.1.0.jar

      - name: Generate Javadocs
        run: |
          mkdir -p javadocs
          javadoc -encoding ISO-8859-1 -docencoding UTF-8 -charset UTF-8 \
            -d javadocs -sourcepath src -subpackages com.fs.starfarer.api \
            -classpath "StarsectorJarsPrivate/*:extra-jars/*" -quiet -Xdoclint:none \
            -bottom "<p class="legalCopy"><small><i>Copyright © 2013 Fractal Softworks, LLC. All Rights Reserved.</i></small></p>" \
            --add-script dark-theme-default.js \
            -linksource

      - name: Make source pages dark
        run: |
          # The source pages from -linksource have no scripts, so they ignore the theme button and dark-theme-default.js.
          find javadocs/src-html -name '*.html' -exec sed -i 's/<html lang="en">/<html lang="en" data-theme="theme-dark">/' {} +

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: javadocs
